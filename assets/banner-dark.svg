<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Maxim Priezjev: tools for running AI on your own hardware, and for keeping your private data on it.">
<title>Maxim Priezjev: tools for running AI on your own hardware, and for keeping your private data on it.</title>
<defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .name { font-size: 52px; font-weight: 700; fill: #e6edf3; letter-spacing: -1px; }
    .tag { font-size: 19px; fill: #9198a1; }
    .kicker { font-size: 14px; fill: #58a6ff; }
    .chip { font-size: 12px; fill: #e6edf3; }
    .term { font-size: 13px; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .ok { fill: #3fb950; }
  </style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a26"/>
  </linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#bc8cff" stop-opacity=".18"/><stop offset="1" stop-color="#bc8cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#30363d"/></pattern>
  <radialGradient id="fade" cx=".75" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="dotmask"><rect width="1000" height="300" fill="url(#fade)"/></mask>
  <clipPath id="frame"><rect x=".5" y=".5" width="999" height="299" rx="16"/></clipPath>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1220" flood-opacity="0"/></filter>
  <clipPath id="c1"><rect x="614" y="90" width="272" height="22"><animate attributeName="width" values="0;0;272;272" keyTimes="0;0.040;0.190;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c2"><rect x="614" y="114" width="70" height="22"><animate attributeName="width" values="0;0;70;70" keyTimes="0;0.240;0.280;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#dots)" mask="url(#dotmask)" opacity=".7"/>
  <circle cx="150" cy="30" r="300" fill="url(#glowA)"/>
  <circle cx="900" cy="300" r="280" fill="url(#glowB)"/>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="16" fill="none" stroke="#30363d"/>

<text x="56" y="96" class="mono kicker">$ whoami</text>
<text x="54" y="152" class="sans name">Maxim Priezjev</text>
<rect x="56" y="166" width="64" height="3" rx="1.5" fill="url(#ink)"/>
<text x="56" y="198" class="sans tag">Tools for running AI on your own hardware,</text>
<text x="56" y="224" class="sans tag">and for keeping your private data on it.</text>
<rect x="56" y="242" width="54" height="26" rx="13" fill="#1c2433" stroke="#30363d"/><text x="82.8" y="259.5" class="mono chip" text-anchor="middle">Rust</text><rect x="119.6" y="242" width="98" height="26" rx="13" fill="#1c2433" stroke="#30363d"/><text x="168.6" y="259.5" class="mono chip" text-anchor="middle">Local LLMs</text><rect x="227.6" y="242" width="98" height="26" rx="13" fill="#1c2433" stroke="#30363d"/><text x="276.6" y="259.5" class="mono chip" text-anchor="middle">AI privacy</text><rect x="335.6" y="242" width="83" height="26" rx="13" fill="#1c2433" stroke="#30363d"/><text x="377.2" y="259.5" class="mono chip" text-anchor="middle">RouterOS</text>

<g filter="url(#shadow)">
  <rect x="596" y="46" width="360" height="208" rx="12" fill="#0b0f14" stroke="#30363d"/>
</g>
<circle cx="616" cy="62" r="5.5" fill="#ff5f57"/>
<circle cx="634" cy="62" r="5.5" fill="#febc2e"/>
<circle cx="652" cy="62" r="5.5" fill="#28c840"/>
<text x="792" y="66" class="mono dim" font-size="11.5" text-anchor="middle">zsh — ~/projects</text>
<line x1="596" y1="78.5" x2="956" y2="78.5" stroke="#21262d"/>

<g>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.93;0.97;1" dur="10s" repeatCount="indefinite"/>
  <text x="614" y="106" class="mono term" clip-path="url(#c1)"><tspan class="ok">$</tspan> brew install maximpri/tap/mlxtop</text>
  <text x="614" y="130" class="mono term" clip-path="url(#c2)"><tspan class="ok">$</tspan> mlxtop</text>
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.320;0.340;1" dur="10s" repeatCount="indefinite"/>
    <text x="614" y="154" class="mono term dim">Memory</text>
    <rect x="680" y="145" width="160" height="10" rx="3" fill="#21262d"/>
    <rect x="680" y="145" width="104" height="10" rx="3" fill="url(#bar)">
      <animate attributeName="width" values="0;0;104;104" keyTimes="0;0.32;0.42;1" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="852" y="154" class="mono term">41.6/64 GB</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.370;0.390;1" dur="10s" repeatCount="indefinite"/>
    <text x="614" y="178" class="mono term dim">Gen</text>
    <text x="680" y="178" class="mono term">38.6 tok/s <tspan class="dim">· prefill 1.4k/s</tspan></text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.430;0.450;1" dur="10s" repeatCount="indefinite"/>
    <text x="614" y="202" class="mono term ok">✓ Healthy</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.490;0.510;1" dur="10s" repeatCount="indefinite"/>
    <text x="614" y="226" class="mono term"><tspan class="ok">$</tspan></text>
    <rect x="630" y="215" width="8" height="15" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
</svg>
